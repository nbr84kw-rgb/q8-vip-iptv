<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المشاهدة - {site}</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container watch" id="app" hidden>
  <aside class="sidebar">
    <div class="head">
      <input id="search" placeholder="🔍 ابحث عن قناة...">
      <div class="chips" id="chips"></div>
    </div>
    <div class="ch-list" id="list"></div>
  </aside>
  <main class="stage">
    <div class="player">
      <video id="video" controls autoplay playsinline></video>
      <div class="msg" id="msg">اختر قناة من القائمة لبدء المشاهدة</div>
    </div>
    <div class="now"><h3 id="nowName"></h3><button class="btn sm ghost" id="fsBtn">ملء الشاشة ⛶</button></div>
  </main>
</div>

<div class="container account" id="expired" hidden>
  <div class="card" style="text-align:center">
    <h2 style="margin-bottom:10px">⛔ اشتراكك منتهي</h2>
    <p style="color:var(--muted);margin-bottom:18px">فعّل كود اشتراك جديد لمتابعة المشاهدة.</p>
    <a class="btn primary" href="/account.html">تفعيل كود</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="/js/common.js"></script>
<script>
(async () => {
  const { user } = await initNav('watch');
  if (!user) return (location.href = '/login.html');
  if (!user.active) return (expired.hidden = false);

  const [cats, channels] = await Promise.all([api('/api/categories'), api('/api/channels')]);
  app.hidden = false;

  let catId = 'all', q = '', current = null, hls = null;
  const video = document.getElementById('video');

  function renderChips() {
    const total = channels.length;
    chips.innerHTML = `<span class="chip ${catId === 'all' ? 'active' : ''}" data-id="all">الكل (${total})</span>` +
      cats.filter((c) => c.count > 0).map((c) =>
        `<span class="chip ${catId == c.id ? 'active' : ''}" data-id="${c.id}">${esc(c.name)} (${c.count})</span>`).join('');
  }
  function renderList() {
    const t = q.trim().toLowerCase();
    const items = channels.filter((c) => (catId === 'all' || c.category_id == catId) && c.name.toLowerCase().includes(t));
    list.innerHTML = items.map((c) => `
      <div class="ch ${current === c.id ? 'active' : ''}" data-id="${c.id}">
        ${c.logo ? `<img loading="lazy" src="${esc(c.logo)}" alt="" onerror="this.outerHTML='<div class=ph>${esc(c.name.charAt(0))}</div>'">` : `<div class="ph">${esc(c.name.charAt(0))}</div>`}
        <span class="n">${esc(c.name)}</span>
      </div>`).join('') || '<div class="empty">لا توجد قنوات</div>';
  }

  function play(ch) {
    current = ch.id;
    nowName.textContent = ch.name;
    msg.textContent = 'جاري التحميل...'; msg.hidden = false;
    if (hls) { hls.destroy(); hls = null; }
    const isHls = /\.m3u8(\?|$)/i.test(ch.url) || !/\.(mp4|webm|ogg)(\?|$)/i.test(ch.url);
    if (isHls && window.Hls && Hls.isSupported()) {
      hls = new Hls({ enableWorker: true, lowLatencyMode: true });
      hls.loadSource(ch.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) { msg.textContent = 'تعذر الاتصال بالبث... إعادة المحاولة'; msg.hidden = false; hls.startLoad(); }
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else { msg.textContent = 'تعذر تشغيل هذه القناة'; msg.hidden = false; }
      });
    } else {
      video.src = ch.url; // Safari أو ملفات mp4
      video.play().catch(() => {});
    }
    renderList();
  }
  video.addEventListener('playing', () => (msg.hidden = true));

  chips.onclick = (e) => { const id = e.target.dataset.id; if (!id) return; catId = id; renderChips(); renderList(); };
  list.onclick = (e) => { const el = e.target.closest('.ch'); if (el) play(channels.find((c) => c.id == el.dataset.id)); };
  search.oninput = () => { q = search.value; renderList(); };
  fsBtn.onclick = () => (document.fullscreenElement ? document.exitFullscreen() : video.parentElement.requestFullscreen());

  renderChips(); renderList();
})();
</script>
</body>
</html>
