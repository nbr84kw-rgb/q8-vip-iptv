services:
  - type: web
    name: q8-vip-iptv
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PORT
        value: 10000
      - key: SITE_NAME
        value: Q8 VIP IPTV Pro
      - key: TRIAL_DAYS
        value: 1
      - key: CURRENCY
        value: د.ك
      - key: NODE_ENV
        value: production
