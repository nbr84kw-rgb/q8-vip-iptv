name: Build Android TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Debug APK
      working-directory: ./android-tv-app
      run: |
        gradle wrapper
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Q8-VIP-IPTV-TV.apk
        path: android-tv-app/app/build/outputs/apk/debug/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/heads/main')
      with:
        tag_name: v4.3-release
        name: Q8 VIP IPTV Pro v4.3 (Android TV)
        body: |
          👑 **Q8 VIP IPTV Pro - Modern Luxury Smart TV & Android App**
          - التصميم الملكي الجديد بالكامل المطابق لـ Kingly Media Hub
          - دخول مباشر بالأرقام فقط (كود التفعيل / رقم المشترك)
          - تشغيل مباشر للقنوات والأفلام والمسلسلات
          - لوحة تحكم كاملة للإدارة وتوليد الاشتراكات برمز 888888
        files: android-tv-app/app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
